<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="plot_container">
        <canvas id="plot" width="1000px" height="800px"></canvas>
    </div>
    <form>
        <div class="form__block">
            <label for="inputX">Координата X</label>
            <input type="text" id="inputX">
            <div class="errors__container">
                <img src="img/error.svg" alt="" class="errors__mark">
                <div class="input__errors popup" id="inputX__errors">
                </div>
            </div>
        </div>
        <div class="form__block">
            <label for="inputY">Координата Y</label>
            <input type="text" id="inputY">
            <div class="errors__container">
                <img src="img/error.svg" alt="" class="errors__mark">
                <div class="input__errors popup" id="inputY__errors"></div>
            </div>
        </div>
        <div class="form__block">
            <label for="inputR">Радиус R</label>
            <input type="text" id="inputR">
            <div class="errors__container">
                <img src="img/error.svg" alt="" class="errors__mark">
                <div class="input__errors popup" id="inputR__errors"></div>
            </div>
        </div>

        <input type="submit" value="Отправить" id="submitBtn">
    </form>

    <div class="results">
        Результаты

        <table>
            <thead>
            <tr>
                <td>X</td>
                <td>Y</td>
                <td>R</td>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="js/observable.js"></script>
<script src="js/validator.js"></script>
<script src="js/plot/shape.js"></script>
<script src="js/plot/plot.js"></script>

<script src="js/main.js"></script>
</body>
</html>
