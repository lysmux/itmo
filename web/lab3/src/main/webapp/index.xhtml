<ui:composition xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="jakarta.faces.facelets"
             xmlns:h="jakarta.faces.html"
             xmlns:f="jakarta.faces.core"
             xmlns:p="primefaces"
             template="/template.xhtml"
>
    <ui:define name="content">
        <div class="block wide time-block">
            <div>
                <h1>Текущее время</h1> <h:outputText styleClass="time" id="currentTime" value="#{time.dateTime}"/>
                <p:poll interval="10" listener="#{time.update}" update="currentTime"/>
            </div>
            <h:form>
                <div class="button-container">
                    <h:commandButton
                            value="Главная"
                            action="main?faces-redirect=true"
                            styleClass="btn action"
                    />
                </div>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
