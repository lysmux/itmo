<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:t="https://lysmux.dev/jsp/tags/table"
                template="/template.xhtml"
>
    <ui:define name="content">
        <div class="block">
            <div class="plot" id="plot">
                <canvas></canvas>
            </div>
        </div>
        <div class="block">
            <h:form id="form" styleClass="form">
                <div class="block-container">
                    <div class="block">
                        <h:outputLabel for="xVal" value="X"/>
                        <h:inputText
                                id="xVal"
                                styleClass="input"
                                value="#{coordinates.x}"
                                readonly="#{facesContext.currentPhaseId.ordinal eq 6}"
                        >
                            <f:ajax event="change" execute="@this" render="@form:checkBlock"/>
                        </h:inputText>
                        <p:slider
                                for="xVal"
                                minValue="-5"
                                maxValue="5"
                                step="1"
                                rendered="#{facesContext.currentPhaseId.ordinal eq 6}"
                        />
                    </div>
                    <div class="block">
                        <h:outputLabel for="rVal" value="R"/>
                        <h:inputHidden id="rVal" value="#{coordinates.r}"/>
                        <h:panelGroup id="rBlock" styleClass="input-container" layout="block" >
                            <ui:repeat value="#{[1, 2, 3, 4, 5]}" var="r">
                                <h:commandButton
                                        value="#{r}"
                                        onclick="document.dispatchEvent(new CustomEvent('rUpdated', {detail: {r: this.value}}))"
                                        styleClass="checkbox #{coordinates.r == r ? 'selected' : ''}"
                                >
                                    <f:setPropertyActionListener target="#{coordinates.r}" value="#{r}" />
                                    <f:ajax execute="@this" render="@form:checkBlock @form:rVal @form:rBlock" />
                                </h:commandButton>
                            </ui:repeat>
                        </h:panelGroup>
                    </div>
                    <div class="block wide">
                        <h:outputLabel for="yVal" value="Y"/>
                        <h:inputText id="yVal"
                                     styleClass="input"
                                     value="#{coordinates.y}"
                                     maxlength="5"
                        >
                            <f:ajax event="change" execute="@this" render="@form:checkBlock"/>
                        </h:inputText>
                    </div>
                </div>

                <div class="button-container">
                    <h:panelGroup id="checkBlock" styleClass="check-container" layout="block">
                        <h:commandButton
                                id="check-btn"
                                value="Проверить"
                                action="#{coordinates.check}"
                                styleClass="btn action check #{not coordinates.valid ? 'disabled' : ''}"
                        >
                            <f:ajax
                                    execute="@form"
                                    render="results"
                                    onevent="(data) => {
                                        if (data.status === 'success') {
                                            document.dispatchEvent(new CustomEvent('resultsUpdated'))
                                        }
                                    }"
                            />
                        </h:commandButton>
                        <div class="errors-block">
                            <p><h:outputText value="Выберите R" rendered="#{coordinates.r == null}"/></p>
                            <p><h:outputText value="Введите Y" rendered="#{coordinates.y == null}"/></p>
                            <p><h:outputText
                                    value="Y должен быть от -3 до 3"
                                    rendered="#{coordinates.y lt -3 or coordinates.y gt 3}"
                            /></p>
                        </div>
                    </h:panelGroup>
                    <h:commandButton
                            value="Очистить результаты"
                            action="#{results.clear}"
                            styleClass="btn danger"
                    >
                        <f:ajax
                                execute="@form"
                                render="results"
                                onevent="(data) => {
                                    if (data.status === 'success') {
                                        document.dispatchEvent(new CustomEvent('resultsUpdated'))
                                    }
                                }"
                        />
                    </h:commandButton>
                    <h:commandButton
                            value="Вернуться на стартовую"
                            action="index"
                            styleClass="btn action"
                    />
                </div>
            </h:form>
        </div>
        <div class="block wide" style="height: 100%">
            <div class="table-wrapper">
                <t:table id="results" value="#{results.results}" var="result" paginated="true" >
                    <t:column header="Время" sortable="true">
                        <h:outputText value="#{result.time}">
                            <f:convertDateTime pattern="HH:mm:ss" type="zonedDateTime" />
                        </h:outputText>
                    </t:column>
                    <t:column header="X" property="#{result.x}" sortable="true" />
                    <t:column header="Y" property="#{result.y}" sortable="true" />
                    <t:column header="R" property="#{result.r}" sortable="true" />
                    <t:column header="Попадание" sortable="true" >
                        #{result.contains ? "Да" : "Нет"}
                    </t:column>
                    <t:column header="Время выполнения" sortable="true" >
                        #{result.executionTime} нс
                    </t:column>
                </t:table>
            </div>
        </div>

    </ui:define>
</ui:composition>
